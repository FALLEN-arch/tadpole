[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tadpole"
version = "1.0.0"
description = "Native desktop GUI for adb and fastboot (Tkinter with drag and drop)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tkinterdnd2>=0.3.0"]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/FALLEN-arch/tadpole"

[project.gui-scripts]
tadpole = "tadpole.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tadpole = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
