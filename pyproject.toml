[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tadpole"
version = "1.0.0"
description = "Native desktop GUI for adb and fastboot (Tkinter, dark Sun Valley theme, drag and drop)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tkinterdnd2>=0.3.0", "sv-ttk>=2.6", "Pillow>=9.1"]
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]

[project.gui-scripts]
tadpole = "tadpole.ui.main_window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tadpole" = [
    "data/icons/hicolor/scalable/apps/*.svg",
    "data/applications/*.desktop",
    "data/metainfo/*.xml",
]

[tool.setuptools.data-files]
"share/icons/hicolor/scalable/apps" = ["data/icons/hicolor/scalable/apps/com.fallen-arch.Tadpole.svg"]
"share/applications" = ["data/applications/com.fallen-arch.Tadpole.desktop"]
"share/metainfo" = ["data/metainfo/com.fallen-arch.Tadpole.metainfo.xml"]
"share/man/man1" = ["man/tadpole.1"]
